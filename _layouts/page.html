---
layout: default
---
<article class="page">
  {% if page.kicker or page.title %}
    <header class="page__header">
      {% if page.kicker %}<p class="eyebrow">{{ page.kicker }}</p>{% endif %}
      {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
      {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    </header>
  {% endif %}
  {{ content }}
</article>
